name: Release
# Publica os executáveis no GitHub Releases. Duas formas de disparar:
#   - enviar uma tag:  git tag v1.0.0 && git push origin v1.0.0
#   - pelo site: Actions → Release → Run workflow, informando a versão (cria a tag)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go generate ./internal/web
      - run: go test ./...
      - name: Cria a tag (execução manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versão inválida: $VERSION (use vX.Y.Z)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Grava a versão do app Android no código (o build.gradle lê daqui) e
          # marca esse commit com a tag.
          v="${VERSION#v}"; IFS=. read -r major minor patch <<< "$v"
          props=mobile/android/app/version.properties
          sed -i -e "s/^versionName=.*/versionName=$v/" -e "s/^versionCode=.*/versionCode=$((major * 10000 + minor * 100 + patch))/" "$props"
          if ! git diff --quiet "$props"; then
            git commit -m "Versão $v do app Android" "$props"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -a "$VERSION" -m "finan_rich $VERSION"
          git push origin "$VERSION"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: abre o pedido no winget (ver docs/DISTRIBUICAO.md).
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # App Android: compila e publica o .apk no Cloudflare R2 (não no GitHub). A página
  # /baixar do site (o QR code) e o aviso de versão nova do app apontam para lá.
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o APK
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FINAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          export FINAN_VERSION="${TAG#v}"
          cd android
          # Só com a chave do projeto: assinado com outra, o app não atualiza por cima.
          [ -n "$KEYSTORE_BASE64" ] || { echo "Faltam os secrets ANDROID_* (chave de assinatura; veja docs/MOBILE.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finan.jks"
          FINAN_KEYSTORE_FILE="$RUNNER_TEMP/finan.jks" ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/finan_rich.apk"
      - name: Publica no Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # O R2 não aceita as somas de verificação que o aws-cli manda por padrão.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "Faltam os secrets R2_* (veja docs/DISTRIBUICAO.md)"; exit 1; }
          # A mesma conta do build.gradle (a versão vem da tag).
          name="${TAG#v}"; IFS=. read -r major minor patch <<< "$name"; code=$((major * 10000 + minor * 100 + patch))
          apk="$RUNNER_TEMP/finan_rich.apk"
          put() { aws s3 cp --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          type=application/vnd.android.package-archive
          put "$apk" "s3://$R2_BUCKET/android/finan_rich_$name.apk" --content-type "$type"
          put "$apk" "s3://$R2_BUCKET/android/finan_rich.apk" --content-type "$type" --cache-control no-cache \
            --content-disposition 'attachment; filename="finan_rich.apk"'
          # Por último: o app só vê a versão nova quando o APK dela já está lá.
          printf '{"versionName":"%s","versionCode":%s,"sha256":"%s"}\n' "$name" "$code" "$(sha256sum "$apk" | cut -d' ' -f1)" > "$RUNNER_TEMP/latest.json"
          put "$RUNNER_TEMP/latest.json" "s3://$R2_BUCKET/android/latest.json" --content-type application/json --cache-control no-cache
