name: Release
# Publica os executáveis no GitHub Releases. Duas formas de disparar:
#   - enviar uma tag:  git tag v1.0.0 && git push origin v1.0.0
#   - pelo site: Actions → Release → Run workflow, informando a versão (cria a tag)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go generate ./internal/web
      - run: go test ./...
      - name: Cria a tag (execução manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versão inválida: $VERSION (use vX.Y.Z)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Grava a versão do app Android no código (o F-Droid e o IzzyOnDroid
          # leem daqui) e marca esse commit com a tag.
          v="${VERSION#v}"; IFS=. read -r major minor patch <<< "$v"
          props=mobile/android/app/version.properties
          sed -i -e "s/^versionName=.*/versionName=$v/" -e "s/^versionCode=.*/versionCode=$((major * 10000 + minor * 100 + patch))/" "$props"
          if ! git diff --quiet "$props"; then
            git commit -m "Versão $v do app Android" "$props"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -a "$VERSION" -m "finan_rich $VERSION"
          git push origin "$VERSION"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: abre o pedido no winget (ver docs/DISTRIBUICAO.md).
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # App Android: compila e anexa o .apk à mesma release.
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o APK
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FINAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          export FINAN_VERSION="${TAG#v}"
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Assinado com a chave do projeto: atualiza por cima da versão anterior.
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finan.jks"
            FINAN_KEYSTORE_FILE="$RUNNER_TEMP/finan.jks" ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/finan_rich_${FINAN_VERSION}_android.apk"
          else
            # Sem a chave (secrets não configurados): APK de teste, assinado
            # com a chave de depuração.
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/finan_rich_${FINAN_VERSION}_android-teste.apk"
          fi
      - name: Anexa à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/finan_rich_*.apk --clobber
