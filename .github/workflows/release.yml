name: Release
# Publica os executáveis no GitHub Releases. Duas formas de disparar:
#   - enviar uma tag:  git tag v1.0.0 && git push origin v1.0.0
#   - pelo site: Actions → Release → Run workflow, informando a versão (cria a tag)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go generate ./internal/web
      - run: go test ./...
      - name: Cria a tag (execução manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versão inválida: $VERSION (use vX.Y.Z)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Grava a versão do app Android no código (o build.gradle lê daqui) e
          # marca esse commit com a tag.
          v="${VERSION#v}"; IFS=. read -r major minor patch <<< "$v"
          props=mobile/android/app/version.properties
          sed -i -e "s/^versionName=.*/versionName=$v/" -e "s/^versionCode=.*/versionCode=$((major * 10000 + minor * 100 + patch))/" "$props"
          if ! git diff --quiet "$props"; then
            git commit -m "Versão $v do app Android" "$props"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git tag -a "$VERSION" -m "finan_rich $VERSION"
          git push origin "$VERSION"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: abre o pedido no winget (ver docs/DISTRIBUICAO.md).
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # App Android: compila e publica o .apk no Cloudflare Pages (não no GitHub). A página
  # /baixar do site (o QR code) e o aviso de versão nova do app apontam para lá.
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o APK
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FINAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          export FINAN_VERSION="${TAG#v}"
          cd android
          # Só com a chave do projeto: assinado com outra, o app não atualiza por cima.
          [ -n "$KEYSTORE_BASE64" ] || { echo "Faltam os secrets ANDROID_* (chave de assinatura; veja docs/MOBILE.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finan.jks"
          FINAN_KEYSTORE_FILE="$RUNNER_TEMP/finan.jks" ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/finan_rich.apk"
      - name: Publica no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Faltam os secrets CLOUDFLARE_* (veja docs/DISTRIBUICAO.md)"; exit 1; }
          # A mesma conta do build.gradle (a versão vem da tag).
          name="${TAG#v}"; IFS=. read -r major minor patch <<< "$name"; code=$((major * 10000 + minor * 100 + patch))
          out="$RUNNER_TEMP/download"
          mkdir -p "$out/android"
          cp "$RUNNER_TEMP/finan_rich.apk" "$out/android/finan_rich.apk"
          printf '{"versionName":"%s","versionCode":%s,"sha256":"%s"}\n' "$name" "$code" "$(sha256sum "$out/android/finan_rich.apk" | cut -d' ' -f1)" > "$out/android/latest.json"
          # O celular baixa como arquivo de app, com o nome certo.
          printf '/android/finan_rich.apk\n  Content-Type: application/vnd.android.package-archive\n  Content-Disposition: attachment; filename="finan_rich.apk"\n' > "$out/_headers"
          # Cria o projeto na primeira vez (depois, "já existe" não é erro). A publicação troca
          # o APK e o latest.json de uma vez só: o app nunca vê uma versão sem o APK dela.
          npx --yes wrangler@4.152.0 pages project create finan-rich-app --production-branch main || true
          npx --yes wrangler@4.152.0 pages deploy "$out" --project-name finan-rich-app --branch main --commit-dirty=true
