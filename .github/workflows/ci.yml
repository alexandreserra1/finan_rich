name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/engineering/package-lock.json
      - name: Instala ferramentas locais sem scripts de instalação
        run: npm ci --prefix tools/engineering --ignore-scripts --no-fund --no-audit
      - name: Testa os gates e a correção controlada
        run: node --test scripts/engineering.test.mjs scripts/document-assets.test.mjs scripts/ios-validation.test.mjs scripts/audit-tools.test.mjs
      - name: Valida contratos e mudanças
        env:
          OPENSPEC_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: tools/engineering/node_modules/.bin/openspec validate --all --strict
      - name: Verifica vulnerabilidades das ferramentas
        run: node scripts/audit-tools.mjs # alta ou crítica barra; liberações têm prazo no próprio script

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # normal: 2 min; teste travado não fica horas rodando
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Testa o diagnóstico do Cloudflare sem secrets reais
        run: node --test scripts/check-cloudflare.test.mjs
      - name: Gera as regras para o navegador (WebAssembly)
        run: go generate ./internal/web
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Contrato de perfis e sessões em PostgreSQL isolado
        run: sh scripts/test-identity-db.sh
      - name: Regras rodando como WebAssembly
        run: make test-wasm
      - name: Só dependências de código aberto
        run: |
          (cd mobile && npm ci --no-audit --no-fund --ignore-scripts)
          ./scripts/check-licenses.sh
      - name: Falhas de segurança conhecidas nas dependências
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd mobile && npm audit --omit=dev --audit-level=high)
      - name: Compila para todos os sistemas
        run: |
          for target in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/finanrich
          done

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # normal: 3 a 4 min; teste travado não fica horas rodando
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go generate ./internal/web
      - run: go build -o dist/finanrich ./cmd/finanrich
      - name: Telas do app do celular e do site
        run: |
          go run ./tools/mobilebuild mobile/www
          go run ./tools/mobilebuild -site site/www
          go build -tags sitebundle -o dist/finansite ./cmd/api
      # Os pacotes .deb do navegador ficam guardados entre execuções: com o cache, o apt quase
      # não baixa nada e um espelho lento não derruba mais o job (falhou assim em 16/11 e 18/11).
      - name: Pacotes do navegador guardados
        uses: actions/cache@v6
        with:
          path: ~/apt-deb
          key: apt-deb-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: apt-deb-${{ matrix.browser }}-
      - name: Testes no navegador (offline, sincronização, app do celular e site)
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          # As bibliotecas do navegador vêm do espelho do apt da Azure, que às vezes baixa a
          # 20 KB/s (o normal é 40 s ao todo) e prendia o job até o limite de 20 min. Passou
          # de 5 min: tenta de novo sem esse espelho (a lista do runner segue para o
          # archive.ubuntu.com). O timeout roda com sudo para conseguir parar o apt (root).
          deps() { sudo env "PATH=$PATH" timeout 5m npx playwright install-deps ${{ matrix.browser }}; }
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-rich-keep >/dev/null
          sudo cp ~/apt-deb/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          if ! deps; then
            sudo dpkg --configure -a
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            deps
          fi
          mkdir -p ~/apt-deb && cp /var/cache/apt/archives/*.deb ~/apt-deb/ 2>/dev/null || true
          echo "pacotes guardados: $(ls ~/apt-deb | wc -l)"
          npx playwright install ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = webkit ]; then
            FINANRICH_BIN=../dist/finanrich APP_WWW=../mobile/www SITE_BIN=../dist/finansite npm run webkit
          else
            FINANRICH_BIN=../dist/finanrich APP_WWW=../mobile/www SITE_BIN=../dist/finansite npm test
          fi
      - name: Guarda capturas com dados fictícios para revisão visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rich-visual-${{ matrix.browser }}
          path: |
            /tmp/rich-landing-ficticia-*/*.png
            .artifacts/document-import/**/*.png
            .artifacts/android-share/**/*.png
          if-no-files-found: warn
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # normal: 6 min; teste travado não fica horas rodando
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o app Android (release, assinado como na publicação)
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          # Uma chave descartável criada pelo mesmo script que gera a chave de
          # verdade: prova que a assinatura da release funciona.
          PATH=/usr/bin:/bin sh ../scripts/android-key.sh
          export FINAN_KEYSTORE_FILE=$PWD/../finan_rich-chave/finan_rich.p12
          export $(cat ../finan_rich-chave/senhas.txt | sed 's/^ANDROID_/FINAN_/')
          cd android && ./gradlew assembleRelease --no-daemon
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "CN=finan_rich"
      - name: Tamanho do APK (falha acima de 18 MB; o SQLCipher do banco nativo ocupa uns 8)
        run: |
          size=$(stat -c %s mobile/android/app/build/outputs/apk/release/app-release.apk)
          echo "APK: $((size / 1024)) KB"
          test "$size" -lt $((18 * 1024 * 1024))
      - uses: actions/upload-artifact@v7
        with:
          name: finan_rich-android-teste
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Compila os testes do recebimento de documentos
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      # O app abre de verdade num emulador Android (WebView + WebAssembly).
      - name: Habilita KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abre o app num emulador Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Android 17 com páginas de 16 KB (os celulares novos): pega biblioteca nativa sem
          # alinhamento, como a do SQLite do app. A plataforma 36 é a do compileSdk.
          api-level: 36
          system-image-api-level: "37.2"
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: |
            ./scripts/smoke-android.sh android/app/build/outputs/apk/release/app-release.apk
            adb uninstall io.github.alexandreserra1.finanrich
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class io.github.alexandreserra1.finanrich.SharedDocumentsInstrumentedTest io.github.alexandreserra1.finanrich.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/rich-shared-documents-android.log
            grep -Eq 'OK \([1-9][0-9]* tests?\)' /tmp/rich-shared-documents-android.log
            adb logcat -d -s Capacitor/Console > /tmp/rich-shared-documents-console.log
            if grep -q '"base64"' /tmp/rich-shared-documents-console.log; then exit 1; fi
            adb pull /sdcard/Android/data/io.github.alexandreserra1.finanrich/files/share-preview.png /tmp/rich-shared-document-preview.png
      - name: Guarda a revisão fictícia no emulador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rich-android-compartilhamento
          path: |
            /tmp/rich-shared-documents-android.log
            /tmp/rich-shared-document-preview.png
          if-no-files-found: warn
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 30 # normal: 2 min; teste travado não fica horas rodando
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o app iOS para o simulador (sem assinatura)
        working-directory: mobile
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npx cap sync ios
          mkdir -p ../.artifacts/ios-validation
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rich-ios" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../.artifacts/ios-validation/build.log | tail -30
      - name: Abre e navega no iPhone simulado
        working-directory: mobile
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available --json | node ../scripts/select-ios-simulator.mjs)
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/rich-ios" \
            -resultBundlePath ../.artifacts/ios-validation/resultado.xcresult \
            -parallel-testing-enabled NO -only-testing:AppUITests \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ../.artifacts/ios-validation/test.log | tail -50
      - name: Guarda evidências do simulador iPhone
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rich-ios-validacao
          path: |
            .artifacts/ios-validation/build.log
            .artifacts/ios-validation/test.log
            .artifacts/ios-validation/resultado.xcresult
          if-no-files-found: warn
          retention-days: 7
