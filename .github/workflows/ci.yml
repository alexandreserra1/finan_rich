name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # normal: 2 min; teste travado não fica horas rodando
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Testa o diagnóstico do Cloudflare sem secrets reais
        run: node --test scripts/check-cloudflare.test.mjs
      - name: Gera as regras para o navegador (WebAssembly)
        run: go generate ./internal/web
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Regras rodando como WebAssembly
        run: make test-wasm
      - name: Só dependências de código aberto
        run: |
          (cd mobile && npm ci --no-audit --no-fund --ignore-scripts)
          ./scripts/check-licenses.sh
      - name: Falhas de segurança conhecidas nas dependências
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd mobile && npm audit --omit=dev --audit-level=high)
      - name: Compila para todos os sistemas
        run: |
          for target in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/finanrich
          done

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # normal: 3 a 4 min; teste travado não fica horas rodando
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go generate ./internal/web
      - run: go build -o dist/finanrich ./cmd/finanrich
      - name: Telas do app do celular e do site
        run: |
          go run ./tools/mobilebuild mobile/www
          go run ./tools/mobilebuild -site site/www
          go build -tags sitebundle -o dist/finansite ./cmd/api
      - name: Testes no navegador (offline, sincronização, app do celular e site)
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          # As bibliotecas do navegador vêm do espelho do apt da Azure, que às vezes baixa a
          # 20 KB/s (o normal é 40 s ao todo) e prendia o job até o limite de 20 min. Passou
          # de 5 min: tenta de novo sem esse espelho (a lista do runner segue para o
          # archive.ubuntu.com). O timeout roda com sudo para conseguir parar o apt (root).
          deps() { sudo env "PATH=$PATH" timeout 5m npx playwright install-deps ${{ matrix.browser }}; }
          if ! deps; then
            sudo dpkg --configure -a
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            deps
          fi
          npx playwright install ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = webkit ]; then
            FINANRICH_BIN=../dist/finanrich APP_WWW=../mobile/www SITE_BIN=../dist/finansite npm run webkit
          else
            FINANRICH_BIN=../dist/finanrich APP_WWW=../mobile/www SITE_BIN=../dist/finansite npm test
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # normal: 6 min; teste travado não fica horas rodando
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o app Android (release, assinado como na publicação)
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          # Uma chave descartável criada pelo mesmo script que gera a chave de
          # verdade: prova que a assinatura da release funciona.
          PATH=/usr/bin:/bin sh ../scripts/android-key.sh
          export FINAN_KEYSTORE_FILE=$PWD/../finan_rich-chave/finan_rich.p12
          export $(cat ../finan_rich-chave/senhas.txt | sed 's/^ANDROID_/FINAN_/')
          cd android && ./gradlew assembleRelease --no-daemon
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "CN=finan_rich"
      - name: Tamanho do APK (falha acima de 18 MB; o SQLCipher do banco nativo ocupa uns 8)
        run: |
          size=$(stat -c %s mobile/android/app/build/outputs/apk/release/app-release.apk)
          echo "APK: $((size / 1024)) KB"
          test "$size" -lt $((18 * 1024 * 1024))
      - uses: actions/upload-artifact@v7
        with:
          name: finan_rich-android-teste
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
      # O app abre de verdade num emulador Android (WebView + WebAssembly).
      - name: Habilita KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abre o app num emulador Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Android 17 com páginas de 16 KB (os celulares novos): pega biblioteca nativa sem
          # alinhamento, como a do SQLite do app. A plataforma 36 é a do compileSdk.
          api-level: 36
          system-image-api-level: "37.2"
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./scripts/smoke-android.sh android/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 30 # normal: 2 min; teste travado não fica horas rodando
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o app iOS para o simulador (sem assinatura)
        working-directory: mobile
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
