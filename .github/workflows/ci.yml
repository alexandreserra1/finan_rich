name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gera as regras para o navegador (WebAssembly)
        run: go generate ./internal/web
      - name: Formatação
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Regras rodando como WebAssembly
        run: make test-wasm
      - name: Só dependências de código aberto
        run: |
          (cd mobile && npm ci --no-audit --no-fund --ignore-scripts)
          ./scripts/check-licenses.sh
      - name: Falhas de segurança conhecidas nas dependências
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          (cd mobile && npm audit --omit=dev --audit-level=high)
      - name: Compila para todos os sistemas
        run: |
          for target in windows/amd64 darwin/arm64 darwin/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/finanrich
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go generate ./internal/web
      - run: go build -o dist/finanrich ./cmd/finanrich
      - name: Telas do app do celular
        run: go run ./tools/mobilebuild mobile/www
      - name: Testes no navegador (offline, sincronização e app do celular)
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          FINANRICH_BIN=../dist/finanrich APP_WWW=../mobile/www npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o app Android (release, assinado como na publicação)
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          # Uma chave descartável criada pelo mesmo script que gera a chave de
          # verdade: prova que a assinatura da release funciona.
          PATH=/usr/bin:/bin sh ../scripts/android-key.sh
          export FINAN_KEYSTORE_FILE=$PWD/../finan_rich-chave/finan_rich.p12
          export $(cat ../finan_rich-chave/senhas.txt | sed 's/^ANDROID_/FINAN_/')
          cd android && ./gradlew assembleRelease --no-daemon
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "CN=finan_rich"
      - name: Tamanho do APK (falha acima de 12 MB)
        run: |
          size=$(stat -c %s mobile/android/app/build/outputs/apk/release/app-release.apk)
          echo "APK: $((size / 1024)) KB"
          test "$size" -lt $((12 * 1024 * 1024))
      - uses: actions/upload-artifact@v7
        with:
          name: finan_rich-android-teste
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
      # O app abre de verdade num emulador Android (WebView + WebAssembly).
      - name: Habilita KVM para o emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abre o app num emulador Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./scripts/smoke-android.sh android/app/build/outputs/apk/release/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go generate ./internal/web
      - run: go run ./tools/mobilebuild mobile/www
      - name: Compila o app iOS para o simulador (sem assinatura)
        working-directory: mobile
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
