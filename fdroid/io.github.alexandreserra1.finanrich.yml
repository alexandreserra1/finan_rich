# Receita do F-Droid (vai para o repositório fdroiddata, em
# metadata/io.github.alexandreserra1.finanrich.yml). O workflow
# .github/workflows/fdroid.yml roda os mesmos comandos a cada mudança, para a
# receita não quebrar sem a gente perceber. Veja docs/DISTRIBUICAO.md.
Categories:
  - Money
License: MIT
SourceCode: https://github.com/alexandreserra1/finan_rich
IssueTracker: https://github.com/alexandreserra1/finan_rich/issues
Changelog: https://github.com/alexandreserra1/finan_rich/releases

AutoName: finan_rich

RepoType: git
Repo: https://github.com/alexandreserra1/finan_rich.git

Builds:
  - versionName: 1.7.0
    versionCode: 10700
    commit: v1.7.0
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -fsSLo /tmp/go.tgz https://go.dev/dl/go1.26.0.linux-amd64.tar.gz
      - echo "aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235  /tmp/go.tgz" | sha256sum -c
      - tar -C /opt -xzf /tmp/go.tgz
      - curl -fsSLo /tmp/node.txz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/node.txz"
        | sha256sum -c
      - tar -C /opt -xJf /tmp/node.txz
    gradle:
      - yes
    prebuild:
      - sed -i -e '/signingConfig keystoreFile/d' build.gradle
      - export PATH="/opt/go/bin:/opt/node-v22.23.3-linux-x64/bin:$PATH" GOTOOLCHAIN=local
        GOFLAGS=-trimpath
      - cd ../../..
      - go generate ./internal/web
      - go run ./tools/mobilebuild mobile/www
      - cd mobile
      - npm ci --no-audit --no-fund
      - npx cap sync android

  - versionName: 1.9.0
    versionCode: 10900
    commit: v1.9.0
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -fsSLo /tmp/go.tgz https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
      - echo "ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5  /tmp/go.tgz" | sha256sum -c
      - tar -C /opt -xzf /tmp/go.tgz
      - curl -fsSLo /tmp/node.txz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
      - echo "df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/node.txz"
        | sha256sum -c
      - tar -C /opt -xJf /tmp/node.txz
    gradle:
      - yes
    prebuild:
      - sed -i -e '/signingConfig keystoreFile/d' build.gradle
      - export PATH="/opt/go/bin:/opt/node-v22.23.3-linux-x64/bin:$PATH" GOTOOLCHAIN=local
        GOFLAGS=-trimpath
      - cd ../../..
      - go generate ./internal/web
      - go run ./tools/mobilebuild mobile/www
      - cd mobile
      - npm ci --no-audit --no-fund
      - rm -rf node_modules/@wllama
      - npx cap sync android
    scandelete:
      - mobile/node_modules/@wllama

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: mobile/android/app/version.properties|versionCode=(\d+)|mobile/android/app/version.properties|versionName=(.+)
CurrentVersion: 1.9.0
CurrentVersionCode: 10900
