services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finan
      POSTGRES_PASSWORD: finan
      POSTGRES_DB: finan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finan"]
      interval: 2s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://finan:finan@db:5432/finan?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
    ports:
      - "127.0.0.1:8080:8080"
    profiles: ["app"]

volumes:
  pgdata:
