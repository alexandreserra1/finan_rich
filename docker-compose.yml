# Alternativa ao executável, para quem prefere Docker.
#
#   docker compose up -d                    -> app em http://localhost:8080
#   docker compose --profile ollama up -d   -> app + Ollama dentro do Docker
#
# No Mac, prefira o Ollama instalado direto no sistema (ollama.com/download):
# dentro do Docker ele não usa a GPU do Mac e fica bem mais lento. O app já
# procura o Ollama do sistema em host.docker.internal.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - finan-data:/data
    environment:
      FINAN_AI_BASE_URL: ${FINAN_AI_BASE_URL:-http://host.docker.internal:11434}
      FINAN_AI_MODEL: ${FINAN_AI_MODEL:-qwen3.5:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway" # necessário no Linux
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Com o profile "ollama", aponte o app para cá:
    #   FINAN_AI_BASE_URL=http://ollama:11434 docker compose --profile ollama up -d

volumes:
  finan-data:
  ollama-models:
