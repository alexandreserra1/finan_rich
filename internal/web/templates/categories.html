{{define "content"}}
<section class="panel">
  <h2>Divisão do salário</h2>
  <p class="muted">Quanto da renda do mês vai para cada grupo. A regra clássica é 50/30/20; ajuste à sua realidade (a soma precisa dar 100%).</p>
  <form method="post" action="/divisao" class="grid-form">
    <label>Necessidades (%) <input type="number" name="necessidades" min="0" max="100" value="{{index .Split "necessidades"}}"></label>
    <label>Desejos (%) <input type="number" name="desejos" min="0" max="100" value="{{index .Split "desejos"}}"></label>
    <label>Investimentos (%) <input type="number" name="investimentos" min="0" max="100" value="{{index .Split "investimentos"}}"></label>
    <button type="submit">Salvar divisão</button>
  </form>
</section>

<section class="panel">
  <h2>Nova categoria</h2>
  <form method="post" action="/categorias" class="grid-form">
    <label>Nome <input name="name" required placeholder="Ex.: Pet"></label>
    <label>Grupo
      <select name="bucket">
        {{range .Buckets}}<option value="{{.}}">{{bucketLabel .}}</option>{{end}}
      </select>
    </label>
    <button type="submit">Criar</button>
  </form>
</section>

<section class="panel">
  <h2>Categorias</h2>
  <table>
    <thead><tr><th>Nome</th><th>Grupo</th><th></th></tr></thead>
    <tbody>
    {{range .Categories}}
      <tr>
        <td>{{.Name}}</td>
        <td><span class="tag b-{{.Bucket}}">{{bucketLabel .Bucket}}</span></td>
        <td class="num">
          <form method="post" action="/categorias/{{.ID}}/apagar" onsubmit="return confirm('Apagar a categoria {{.Name}}?')">
            <button class="link" type="submit">apagar</button>
          </form>
        </td>
      </tr>
    {{end}}
    </tbody>
  </table>
</section>
{{end}}
